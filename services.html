    <style>

        :root {

            --pink: #e91e8c;

            --pink-light: #ff6bb5;

            --pink-soft: #fff0f7;

            --blue: #2563eb;

            --blue-light: #60a5fa;

            --blue-soft: #eff6ff;

            --dark: #1a1a2e;

            --gray: #6b7280;

        }



        * { margin: 0; padding: 0; box-sizing: border-box; }



        body {

            font-family: 'Poppins', sans-serif;

            background: var(--white);

            color: var(--dark);

            overflow-x: hidden;

        }



        /* ===== HEADER ===== */

        header {

            background: rgba(255,255,255,0.95);

            backdrop-filter: blur(12px);

            border-bottom: 1px solid rgba(233,30,140,0.1);

            position: sticky;

            top: 0;

            z-index: 999;

            padding: 0 20px;

        }



        .nav-container {

            display: flex;

        }



        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }

        .logo-icon {

            width: 44px; height: 44px;

            background: var(--dark);

            border-radius: 50%;

            display: flex; align-items: center; justify-content: center;

            color: var(--pink);

            font-size: 20px;

        }

        .logo-text { font-size: 1.2rem; font-weight: 700; color: var(--dark); }

        .logo-tagline { font-size: 0.65rem; color: var(--gray); }



        .nav-links { display: flex; gap: 8px; }

        .nav-links a {

            color: var(--dark);

            font-size: 0.9rem;

            font-weight: 500;

            padding: 6px 14px;

            border-radius: 8px;

            transition: all 0.2s;

        }

        .nav-links a:hover, .nav-links a.active { color: var(--pink); }

        .nav-links a.active { border-bottom: 2px solid var(--pink); }



        .btn-whatsapp {

            background: var(--green-wa);

            color: white;

            padding: 10px 20px;

            border-radius: 10px;

            text-decoration: none;

            font-size: 0.88rem;

            transition: all 0.2s;
